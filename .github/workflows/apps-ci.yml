name: Apps CI

on:
  push:
    branches: [main]
    paths:
      - "Clients/**"
      - ".github/workflows/apps-ci.yml"
  pull_request:
    paths:
      - "Clients/**"
      - ".github/workflows/apps-ci.yml"
  workflow_dispatch:

concurrency:
  group: apps-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: Clients

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88.0"

jobs:
  web:
    name: TypeScript check and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Clients/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust:
    name: Rust tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev libopus-dev
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Clients/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: "Clients -> target"
      - run: cargo test --workspace

  linux-build:
    name: Linux build smoke test (deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev libopus-dev \
            patchelf desktop-file-utils appstream
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Clients/package-lock.json
      - run: npm ci
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          workspaces: "Clients -> target"
          key: smoke
      - run: npx tauri build --bundles deb
      - name: Inspect package and metadata
        run: |
          dpkg-deb -I target/release/bundle/deb/*.deb
          dpkg-deb -c target/release/bundle/deb/*.deb
          ls -l target/release/bundle/deb/
          desktop-file-validate packaging/flatpak/app.workchat.WorkChat.desktop
          appstreamcli validate --no-net packaging/flatpak/app.workchat.WorkChat.metainfo.xml || true
