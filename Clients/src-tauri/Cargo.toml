[package]
name = "workchat"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WorkChat: team chat client"

[lib]
name = "workchat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-workchat = { path = "../crates/tauri-plugin-workchat" }
ring = "0.17"
proto.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
futures-util = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rand = "0.8"
percent-encoding = "2"
cpal = "0.15"
opus = "0.3"
ogg = "0.9"
imagesize = "0.13"
base64 = "0.22"
symphonia = { version = "0.5", default-features = false, features = ["aac", "mp3", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm", "alac", "adpcm"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-notification = "2"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
