[workspace]
resolver = "2"
members = ["src-tauri", "crates/workchat-proto", "crates/tauri-plugin-workchat"]

[workspace.package]
version = "1.5.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/uri-travoski/workchat-claude"
authors = ["WorkChat contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["preserve_order"] }
url = "2"
proto = { package = "workchat-proto", path = "crates/workchat-proto" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
