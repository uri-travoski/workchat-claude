[package]
name = "workchat-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "workchat-server"

[[bin]]
name = "workchat-server"
path = "src/main.rs"

[dependencies]
hayro = { version = "0.9", features = ["embed-fonts"] }
proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
base64.workspace = true
futures-util.workspace = true
async-trait.workspace = true
bytes.workspace = true
url.workspace = true
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
serde_urlencoded = "0.7"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "limit"] }
tokio-util = { version = "0.7", features = ["io"] }
argon2 = "0.5"
hmac = "0.12"
object_store = { version = "0.12", default-features = false, features = ["aws", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
mime_guess = "2"
jsonwebtoken = "9"
age = "0.11"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
workchat-testkit = { path = "../testkit" }
